# DAPO 强化学习配置（在 GRPO 基础上加入 DAPO 四技巧）
# 参考：https://arxiv.org/abs/2503.14476
# 数据由 scripts/03b_build_rl_prompts.py 生成
model_name_or_path: "checkpoints/sft"
dataset_path: "data/processed/rl_prompts.jsonl"

output_dir: "checkpoints/dapo"
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-6
lr_scheduler_type: "cosine"

# GRPO 基础超参
num_generations: 8            # G 需满足 2 <= G <= per_device_batch x num_processes 且整除
max_completion_length: 2048
temperature: 1.0

# DAPO 去掉 KL 惩罚（论文 §2.3）。如需保留可改为 0.001~0.04 并开启 kl_annealing
beta: 0.0
kl_annealing:
  enabled: false

# DAPO 专用技巧
dapo:
  eps_low: 0.2                # clip 下界半径（1 - eps_low）
  eps_high: 0.28              # clip 上界半径（1 + eps_high），大于 eps_low 留探索空间
  dynamic_sampling: true      # 过滤组内 reward 全相同（全对/全错）的 prompt
  dynamic_sampling_eps: 1e-3  # |advantage| 上界阈值，低于则认为该组无有效梯度
  overlong_shaping: true      # 超长/截断样本软惩罚（Eq.13）
  max_length: 2048            # L_max，建议 = max_completion_length
  punish_cache: 256           # L_cache：软惩罚区间长度

# 复合 Reward 权重
reward:
  format_weight: 1.0          # 格式硬约束
  judge_weight: 1.0           # LLM-as-Judge 连续分
  judge_enabled: true         # false = 纯规则 reward（格式 0/1），可跳过 judge 模型
  judge_base_url: "http://localhost:8001/v1"
  judge_model: "Qwen/Qwen2.5-32B-Instruct-AWQ"

bf16: true
gradient_checkpointing: true
logging_steps: 5