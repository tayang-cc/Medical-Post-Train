# GRPO 强化学习配置
# 数据由 scripts/03b_build_rl_prompts.py 生成（messages 形式，自动套 chat template）
model_name_or_path: "/root/autodl-tmp/models/Qwen2.5-7B-Instruct"   # 基座；正式跑 --merge-from-sft checkpoints/sft_clean
dataset_path: "data/processed/rl_prompts.jsonl"

output_dir: "checkpoints/grpo"
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-6           # 调参：风格已对齐，用适中 lr（v1=1e-6 太保守 / v2=1e-5 过拟合）
lr_scheduler_type: "cosine"

# GRPO 超参
num_generations: 4            # G 需满足 2 <= G <= per_device_batch x num_processes 且整除
max_completion_length: 1024
temperature: 1.0
beta: 0.04                    # KL 惩罚系数初值（退火起点）

# KL 退火：训练早期强约束、后期放松，抑制 Reward Hacking
kl_annealing:
  enabled: true
  beta_start: 0.04             # 调参：0.1 → 0.04（起始约束过强抑制策略移动）
  beta_end: 0.005              # 调参：0.01 → 0.005（后期更放松）
  schedule: "cosine"          # cosine | linear
  total_steps: null           # null 时自动用 state.max_steps

# 熵正则：loss += entropy_coef * mean(log p)，防策略坍缩（配合 KL 退火）
entropy_coef: 0.001

# 复合 Reward 权重
reward:
  format_weight: 1.0          # 格式硬约束（Judge 模式用）
  judge_weight: 1.0           # LLM-as-Judge 连续分（仅 judge_enabled=true 时用）
  judge_enabled: false        # Step4：RL 不再调 32B Judge
  judge_base_url: "http://localhost:8001/v1"
  judge_model: "Qwen/Qwen2.5-32B-Instruct-AWQ"
  result_weight: 1.0          # 二进制结果奖励权重
  process_weight: 1.0         # PRM min 聚合过程奖励权重

# 进程内 7B-PRM（替代 32B Judge，仅离线构建 PRM 数据集时用 32B）
prm:
  enabled: true
  base: "/root/autodl-tmp/models/Qwen2.5-7B-Instruct"
  adapter: "checkpoints/prm"

bf16: true
gradient_checkpointing: false     # 96GB 够用；关闭避免冻结基座+检查点导致的 LoRA 梯度断裂 & 显存峰值
logging_steps: 5